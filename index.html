<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Creditor Audit Book</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--bg:#f6f8fc;--card:#fff;--tx:#1f1f1f;--tx2:#5f6368;--line:#e6e9ee;--hv:#f1f3f4;--b:#1a73e8;--onb:#fff;--r:#ea4335;--y:#fbbc04;--g:#34a853;--gt:#188038;--rt:#d93025}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#131314;--card:#1e1f20;--tx:#e3e3e3;--tx2:#9aa0a6;--line:#37393b;--hv:#2a2b2d;--b:#8ab4f8;--onb:#062e6f;--gt:#81c995;--rt:#f28b82}}
[data-theme=dark]{--bg:#131314;--card:#1e1f20;--tx:#e3e3e3;--tx2:#9aa0a6;--line:#37393b;--hv:#2a2b2d;--b:#8ab4f8;--onb:#062e6f;--gt:#81c995;--rt:#f28b82}
*{box-sizing:border-box;margin:0}
html,body{height:100%;height:100dvh;overflow:hidden}
body{font:400 14px/1.4 Roboto,system-ui,sans-serif;background:var(--bg);color:var(--tx);display:flex;flex-direction:column}
h1,h2,.hd,.st b{font-family:Outfit,Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}svg{display:block}
:focus-visible{outline:2px solid var(--b);outline-offset:2px}
#pb{position:fixed;top:0;left:0;height:3px;width:0;z-index:99;background:linear-gradient(90deg,var(--b) 25%,var(--r) 25% 50%,var(--y) 50% 75%,var(--g) 75%)}
#pb.go{animation:pg .8s ease-out}@keyframes pg{0%{width:0;opacity:1}85%{width:100%;opacity:1}100%{width:100%;opacity:0}}
header{display:flex;align-items:center;gap:10px;padding:10px 16px;height:64px;flex:none}
.logo{display:grid;grid-template-columns:1fr 1fr;gap:2px;width:34px;height:34px;border-radius:10px;overflow:hidden;flex:none}
.logo i:nth-child(1){background:var(--b)}.logo i:nth-child(2){background:var(--r)}.logo i:nth-child(3){background:var(--y)}.logo i:nth-child(4){background:var(--g)}
header h1{font-size:20px;font-weight:600;white-space:nowrap}.sp{flex:1}
.srch{width:min(320px,34vw);display:flex;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:0 14px;height:42px;gap:8px;color:var(--tx2)}
.srch:focus-within{border-color:var(--b)}.srch input{flex:1;border:0;background:none;outline:0;min-width:0}
.btn,.ib{cursor:pointer;border:0;background:none}
.btn{border-radius:999px;height:40px;padding:0 20px;font-weight:500;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.btn.pri{background:var(--b);color:var(--onb)}.btn.txt{color:var(--b)}.btn.txt:hover,.ib:hover{background:var(--hv)}.btn.red{color:var(--rt)}
.ib{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:var(--tx2);flex:none}
.xs{display:flex;align-items:center;gap:8px;color:var(--tx2);font-size:12px;white-space:nowrap;cursor:pointer;padding:6px 12px;border-radius:999px;border:1px solid var(--line);max-width:240px;overflow:hidden;text-overflow:ellipsis;background:var(--card)}
.xs i{width:8px;height:8px;border-radius:50%;background:var(--tx2);flex:none}.xs.ok i{background:var(--g)}.xs.w i{background:var(--y)}.xs.e i{background:var(--r)}
main{flex:1;min-height:0;display:grid;grid-template-columns:292px 1fr;gap:16px;padding:0 16px 16px}
.card{background:var(--card);border-radius:24px;box-shadow:0 1px 3px rgba(60,64,67,.12);min-height:0}
aside{display:flex;flex-direction:column;overflow:hidden}
.ah{padding:16px 24px 6px}.ah h2{font-size:17px;font-weight:600}
#cl{flex:1;overflow:auto;padding:4px 10px}
.ci{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:18px;cursor:pointer}.ci:hover{background:var(--hv)}.ci.on{background:color-mix(in srgb,var(--b) 16%,transparent)}
.av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:#fff;font:600 15px Outfit,sans-serif;flex:none;font-style:normal}
.ci>div{flex:1;min-width:0}.ci b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ci small{color:var(--tx2);font-size:12px}.ci small em{color:var(--rt);font-style:normal;font-weight:500}.ci .amt{font-weight:500;font-size:13px}
.nc{margin:8px 14px 14px}
section{display:flex;flex-direction:column;gap:14px;min-height:0;min-width:0}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;flex:none}
.st{padding:12px 18px}.st span{color:var(--tx2);font-size:11px;font-weight:500;letter-spacing:.4px;text-transform:uppercase}
.st b{display:block;font-size:22px;white-space:nowrap;line-height:1.25}.st small{color:var(--tx2);font-size:12px;display:block}
.st.o{background:color-mix(in srgb,var(--b) 13%,var(--card))}.st.d b{color:var(--rt)}
.bar{height:6px;border-radius:9px;background:var(--hv);margin-top:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--g)}
.led{flex:1;display:flex;flex-direction:column;overflow:hidden}
.lh{display:flex;align-items:center;gap:8px;padding:14px 16px 8px 24px;flex-wrap:wrap}
.lh h2{font-size:20px;font-weight:600;line-height:1.2}.lh small{display:block;color:var(--tx2)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:none;border-radius:999px;height:32px;padding:0 14px;cursor:pointer}
.chip.on{background:color-mix(in srgb,var(--b) 16%,transparent);border-color:transparent;color:var(--b);font-weight:500}
.tw{flex:1;overflow:auto;min-height:0;padding:0 12px}
table{width:100%;border-collapse:collapse;min-width:680px}
th{position:sticky;top:0;background:var(--card);text-align:left;color:var(--tx2);font-weight:500;font-size:12px;padding:8px 12px;border-bottom:1px solid var(--line);z-index:1}
td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:hover td{background:var(--hv)}tr.sel td{background:color-mix(in srgb,var(--y) 20%,transparent)}
.r{text-align:right;white-space:nowrap}td small{display:block;color:var(--tx2);font-size:12px}
.cr{color:var(--rt)}.dr{color:var(--gt)}tfoot td{font-weight:600;position:sticky;bottom:0;background:var(--card);border-top:2px solid var(--line)}
.pl{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:500;background:color-mix(in srgb,var(--y) 28%,transparent)}
.pl.g{background:color-mix(in srgb,var(--g) 22%,transparent);color:var(--gt)}.pl.r{background:color-mix(in srgb,var(--r) 18%,transparent);color:var(--rt)}
.ck{width:26px;height:26px;border-radius:50%;border:2px solid var(--tx2);background:none;cursor:pointer;display:grid;place-items:center;color:#fff;padding:0}
.ck.v{background:var(--g);border-color:var(--g)}.ck:not(.v) svg{opacity:0}.ck:not(.v):hover svg{opacity:.5;color:var(--tx2)}
.acts{opacity:0;white-space:nowrap}tr:hover .acts{opacity:1}@media(hover:none){.acts{opacity:1}}
.em{display:grid;place-items:center;text-align:center;padding:30px;color:var(--tx2);height:100%}
.dock{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:14px 16px;margin:0 12px 12px;border-radius:22px;background:var(--hv);border:2px solid transparent;flex:none}
.dock.ed{border-color:var(--y)}
.seg{display:flex;background:var(--card);border-radius:999px;padding:3px}.seg input{display:none}
.seg label{padding:9px 16px;border-radius:999px;cursor:pointer;font-weight:500;color:var(--tx2)}
#rb:checked+label{background:color-mix(in srgb,var(--r) 18%,transparent);color:var(--rt)}#rp:checked+label{background:color-mix(in srgb,var(--g) 24%,transparent);color:var(--gt)}
.fld{position:relative;flex:1 1 120px;min-width:0}.fld.w{flex:2 1 170px}
.fld input{width:100%;height:50px;border:1px solid var(--line);border-radius:14px;background:var(--card);padding:18px 14px 0;outline:0}
.fld label{position:absolute;left:14px;top:15px;color:var(--tx2);pointer-events:none;transition:.15s}
.fld input:focus{border-color:var(--b)}
.fld input:focus+label,.fld input:not(:placeholder-shown)+label,.fld.fl label{top:5px;font-size:11px}
.fld.bad input{border-color:var(--r)}
dialog{border:0;border-radius:24px;background:var(--card);color:var(--tx);padding:24px;width:min(560px,94vw);box-shadow:0 8px 40px rgba(0,0,0,.3);margin:auto}
dialog::backdrop{background:rgba(0,0,0,.45)}dialog h2{font-size:22px;margin-bottom:12px}dialog .fld{margin-bottom:12px;flex:none}dialog .fld input{background:none;border-color:var(--tx2)}
dialog ol{padding-left:20px;color:var(--tx2);margin-bottom:12px;line-height:1.6}dialog textarea{width:100%;height:150px;border:1px solid var(--line);border-radius:12px;background:var(--hv);padding:10px;font:12px/1.4 ui-monospace,monospace;margin-bottom:8px}
.ac{display:flex;gap:8px;align-items:center;margin-top:8px}
#sb{position:fixed;left:16px;bottom:16px;z-index:90;background:#303134;color:#e8eaed;border-radius:12px;padding:12px 12px 12px 18px;display:flex;align-items:center;gap:14px;transform:translateY(160%);transition:transform .25s;max-width:calc(100vw - 32px)}
#sb.on{transform:none}#sb button{border:0;background:none;color:#8ab4f8;font-weight:500;cursor:pointer;padding:6px 10px}
#mn{position:absolute;right:16px;top:58px;z-index:20;background:var(--card);border-radius:18px;box-shadow:0 4px 24px rgba(0,0,0,.25);padding:8px;display:none;min-width:220px}#mn.on{display:block}
#mn button{display:block;width:100%;border:0;background:none;padding:10px 14px;border-radius:12px;cursor:pointer;text-align:left}#mn button:hover{background:var(--hv)}
#scr{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:49;display:none}.mb{display:none}
@media(max-width:900px){.srch{width:auto;flex:1}header h1,header>.sp{display:none}.xs{max-width:44px;padding:6px 14px;font-size:0}
 main{grid-template-columns:1fr;padding:0 10px 10px;gap:10px}.mb{display:grid}
 aside{position:fixed;left:0;top:0;bottom:0;width:300px;z-index:50;border-radius:0 24px 24px 0;transform:translateX(-105%);transition:transform .25s}aside.on{transform:none}#scr.on{display:block}
 .stats{grid-template-columns:1fr 1fr}.dock{padding:10px;margin:0 8px 8px}.lh{padding-left:16px}}
#fab,.mc{display:none}
@media(max-width:900px){
 html{-webkit-text-size-adjust:100%}
 header{padding:8px 10px;height:58px;padding-top:max(8px,env(safe-area-inset-top))}
 .fld input,.srch input{font-size:16px}
 .st{padding:10px 12px}.st b{font-size:18px}.st small{font-size:11px}.st span{font-size:10px}
 .lh{padding:12px 12px 4px}.lh h2{font-size:18px}
 .chips{order:5;width:100%;flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}.chip{flex:none;height:34px}
 .tw{padding:0 8px 80px}
 table{min-width:0;display:block}thead{display:none}tbody,tfoot{display:block}
 tr{display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px;padding:11px 6px;border-bottom:1px solid var(--line)}
 td,th{border:0;padding:0;background:none!important}td:empty{display:none}
 td:first-child{font-weight:500}
 td[data-l]::before{content:attr(data-l) " ";color:var(--tx2);font-size:12px}
 td.dt{flex:1 1 100%;order:3}
 td.acts{opacity:1;margin-left:auto}.ib{width:42px;height:42px}.ck{width:30px;height:30px}
 tfoot td{position:static;font-size:13px}tfoot td:first-child{flex:1 1 100%}
 #fab{display:inline-flex;position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:55;height:52px;padding:0 22px;box-shadow:0 4px 14px rgba(0,0,0,.3)}
 .dock{position:fixed;left:0;right:0;bottom:0;margin:0;border-radius:24px 24px 0 0;z-index:60;max-height:78dvh;overflow:auto;padding:14px 12px calc(14px + env(safe-area-inset-bottom));background:var(--card);box-shadow:0 -4px 24px rgba(0,0,0,.3);transform:translateY(110%);visibility:hidden;transition:transform .25s,visibility .25s}
 .dock.open{transform:none;visibility:visible}
 .dock .fld,.dock .fld.w{flex:1 1 44%}.dock .fld.w{flex-basis:100%}.dock .seg{width:100%}.seg label{flex:1;text-align:center}
 .dock .btn{flex:1}.mc{display:inline-flex}
 #sb{bottom:calc(84px + env(safe-area-inset-bottom))}
 dialog{padding:18px;max-height:92dvh;overflow:auto}
}
@media print{html,body{height:auto;overflow:visible}header,aside,.dock,#sb,.acts,.chips,.lh .btn,.lh .ib,.ck{display:none!important}main{display:block}.tw{overflow:visible}.card{box-shadow:none}}
</style>
</head>
<body>
<div id="pb"></div>
<header>
 <button class="ib mb" id="bm" aria-label="Creditors"></button>
 <div class="logo"><i></i><i></i><i></i><i></i></div><h1>Creditor Audit Book</h1><div class="sp"></div>
 <label class="srch"><span id="si"></span><input id="q" placeholder="Search creditor, bill no. or note  ( / )" autocomplete="off"></label>
 <button class="xs n" id="xs"><i></i>Connect Google Sheet</button>
 <button class="ib" id="th" aria-label="Toggle theme"></button><button class="ib" id="mo" aria-label="More"></button>
 <div id="mn"><button id="m0">Google Sheet settings</button><button id="m6">Sync now (pull from Sheet)</button><button id="m4">Export Excel (.xlsx)</button><button id="m3">Import Excel</button><button id="m1">Export CSV</button><button id="m5">Print ledger / statement</button></div>
 <input type="file" id="fi" accept=".xlsx,.xls" hidden>
</header>
<main>
 <aside class="card"><div class="ah"><h2>Creditors</h2></div><div id="cl"></div><button class="btn pri nc" id="ac"></button></aside>
 <section>
  <div class="stats" id="stats"></div>
  <div class="card led">
   <div class="lh" id="lh"></div><div class="tw" id="tw"></div>
   <form class="dock" id="dk" autocomplete="off">
    <div class="seg"><input type="radio" name="t" id="rb" value="b" checked><label for="rb">Bill</label><input type="radio" name="t" id="rp" value="p"><label for="rp">Payment</label></div>
    <div class="fld w"><input id="dc" list="cl2" placeholder=" "><label>Creditor (type a new name to add)</label></div><datalist id="cl2"></datalist>
    <div class="fld"><input id="dd" type="date"><label>Date</label></div>
    <div class="fld"><input id="da" inputmode="decimal" placeholder=" "><label>Amount ₹</label></div>
    <div class="fld"><input id="dr" placeholder=" "><label>Bill / voucher no.</label></div>
    <div class="fld w"><input id="dn" placeholder=" "><label>Note (optional)</label></div>
    <button class="btn pri" id="ds" type="submit">Add entry</button><button class="btn txt red" id="dl" type="button" hidden>Delete</button><button class="btn txt" id="dx" type="button" hidden>Cancel</button><button class="btn txt mc" id="dcl" type="button">Close</button>
   </form>
  </div>
 </section>
</main>
<button class="btn pri" id="fab" type="button">+ Add entry</button><div id="scr"></div><dialog id="dg"></dialog><div id="sb"><span id="sm"></span></div>

<script>
const $=s=>document.querySelector(s);
const I={edit:'M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04a1 1 0 000-1.41l-2.34-2.34a1 1 0 00-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z',del:'M6 19a2 2 0 002 2h8a2 2 0 002-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z',plus:'M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z',sun:'M12 7a5 5 0 100 10 5 5 0 000-10zM2 13h2v-2H2v2zm18 0h2v-2h-2v2zM11 2v2h2V2h-2zm0 18v2h2v-2h-2z',moon:'M12 3a9 9 0 109 9c0-.46-.04-.92-.1-1.36a5.4 5.4 0 01-4.4 2.26 5.4 5.4 0 01-5.4-5.4c0-1.8.88-3.4 2.26-4.4A9 9 0 0012 3z',menu:'M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z',more:'M12 8a2 2 0 100-4 2 2 0 000 4zm0 2a2 2 0 100 4 2 2 0 000-4zm0 6a2 2 0 100 4 2 2 0 000-4z',search:'M15.5 14h-.79l-.28-.27A6.47 6.47 0 0016 9.5 6.5 6.5 0 109.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z',ok:'M9 16.2L4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4z'};
const ic=(n,s=22)=>`<svg viewBox="0 0 24 24" width="${s}" height="${s}"><path fill="currentColor" d="${I[n]}"/></svg>`;
const E=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fm=n=>'₹'+(+n||0).toLocaleString('en-IN',{maximumFractionDigits:2});
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const fd=d=>{const[y,m,x]=d.split('-');return +x+' '+MON[m-1]+' '+y.slice(2)};
const fs=d=>{const[,m,x]=d.split('-');return +x+' '+MON[m-1]};
const today=()=>{const d=new Date();return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
const addD=(d,n)=>{const x=new Date(d+'T00:00:00Z');x.setUTCDate(x.getUTCDate()+n);return x.toISOString().slice(0,10)};
const diff=(a,b)=>Math.round((new Date(a)-new Date(b))/864e5);
const uid=()=>Math.random().toString(36).slice(2,10);
const COL=['#1a73e8','#ea4335','#188038','#f29900','#a142f4','#12b5cb','#e8710a'];
const colr=s=>COL[[...s].reduce((a,c)=>a+c.charCodeAt(0),0)%COL.length];
let db={c:[],e:[]},sel='all',flt='all',q='',ed=null,K={},T=today(),VIS=[],mem={},sv;
const ls={get(k){try{return localStorage.getItem(k)}catch(e){return mem[k]}},set(k,v){try{localStorage.setItem(k,v)}catch(e){mem[k]=v}}};
try{const d=JSON.parse(ls.get('mann-cab'));if(d&&d.c&&d.e)db=d}catch(e){}
const save=()=>{ls.set('mann-cab',JSON.stringify(db));qsave()};

/* feedback */
const bar=()=>{const b=$('#pb');b.classList.remove('go');void b.offsetWidth;b.classList.add('go')};
let tt;function toast(m,undo){$('#sm').textContent=m;const s=$('#sb');s.querySelector('button')?.remove();
 if(undo){const b=document.createElement('button');b.textContent='Undo';b.onclick=()=>{undo();s.classList.remove('on')};s.append(b)}
 s.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>s.classList.remove('on'),undo?6000:3000)}

/* data */
const sum=(a,t)=>a.filter(e=>e.t==t).reduce((s,e)=>s+e.a,0);
const stat=a=>({bill:sum(a,'b'),paid:sum(a,'p'),out:sum(a,'b')-sum(a,'p'),n:a.length,v:a.filter(e=>e.v).length});
const cname=id=>db.c.find(c=>c.id==id)?.name||'—';
const snap=()=>{const s=JSON.stringify(db);return()=>{db=JSON.parse(s);if(sel!='all'&&!db.c.some(c=>c.id==sel))sel='all';save();render()}};
const byD=(a,b)=>a.d<b.d?-1:a.d>b.d?1:0;
/* payments settle the oldest bills first */
function calc(){const m={};db.c.forEach(c=>{const es=db.e.filter(e=>e.c==c.id).sort(byD);let pool=sum(es,'p');
 es.filter(e=>e.t=='b').forEach(e=>{const al=Math.min(pool,e.a);pool-=al;const open=e.a-al,due=addD(e.d,c.days??30);m[e.id]={open,due,od:open>0.005&&due<T}})});return m}
const odv=a=>a.reduce((s,e)=>s+(K[e.id]?.od?K[e.id].open:0),0);
const odn=a=>a.filter(e=>K[e.id]?.od).length;
const soon=a=>a.filter(e=>{const k=K[e.id];return k&&k.open>0.005&&!k.od&&k.due<=addD(T,7)});
const age=a=>{const r=[0,0,0];a.forEach(e=>{const k=K[e.id];if(k?.od){const n=diff(T,k.due);r[n>60?2:n>30?1:0]+=k.open}});return r};

/* render */
function render(){
 K=calc();T=today();
 $('#cl2').innerHTML=db.c.map(c=>`<option value="${E(c.name)}">`).join('');
 const tot=stat(db.e);
 let h=`<div class="ci ${sel=='all'?'on':''}" data-c="all"><i class="av" style="background:#5f6368">∑</i><div><b>All creditors</b><small>${db.c.length} parties · ${tot.n} entries</small></div><span class="amt">${fm(tot.out)}</span></div>`;
 db.c.map(c=>({c,s:stat(db.e.filter(e=>e.c==c.id)),o:odv(db.e.filter(e=>e.c==c.id))})).filter(x=>x.c.name.toLowerCase().includes(q)).sort((a,b)=>b.o-a.o||b.s.out-a.s.out).forEach(({c,s,o})=>{
  h+=`<div class="ci ${sel==c.id?'on':''}" data-c="${c.id}"><i class="av" style="background:${colr(c.name)}">${E(c.name[0].toUpperCase())}</i><div><b>${E(c.name)}</b><small>${o>0?`<em>${fm(o)} overdue</em>`:`${s.v}/${s.n} audited`}</small></div><span class="amt ${s.out>0?'cr':''}">${fm(s.out)}</span></div>`});
 $('#cl').innerHTML=h;
 const al=sel=='all',cur=db.c.find(c=>c.id==sel),all=db.e.filter(e=>al||e.c==sel),s=stat(all),od=odv(all),pc=s.n?Math.round(s.v/s.n*100):0,sn=soon(all),ag=age(all);
 $('#stats').innerHTML=`<div class="card st o"><span>Outstanding</span><b>${fm(s.out)}</b><small>Billed ${fm(s.bill)} · Paid ${fm(s.paid)}</small></div>
 <div class="card st d"><span>Overdue</span><b>${fm(od)}</b><small>${od?`1–30d ${fm(ag[0])} · 31–60d ${fm(ag[1])} · 60d+ ${fm(ag[2])}`:'Nothing overdue'}</small></div>
 <div class="card st"><span>Due in 7 days</span><b>${fm(sn.reduce((t,e)=>t+K[e.id].open,0))}</b><small>${sn.length} bill(s)</small></div>
 <div class="card st"><span>Audited ${s.v}/${s.n}</span><b>${pc}%</b><div class="bar"><i style="width:${pc}%"></i></div></div>`;
 const srt=[...all].sort(byD),bal={},run={};
 srt.forEach(e=>{run[e.c]=(run[e.c]||0)+(e.t=='b'?e.a:-e.a);bal[e.id]=run[e.c]});
 const rows=VIS=srt.filter(e=>(flt=='all'||(flt=='pend'&&!e.v)||(flt=='done'&&e.v)||(flt=='od'&&K[e.id]?.od)||(flt=='soon'&&sn.includes(e)))&&(!q||[e.ref,e.n,cname(e.c)].join(' ').toLowerCase().includes(q)));
 const sr=stat(rows);
 $('#lh').innerHTML=`<div><h2>${al?'All creditors':E(cur.name)}</h2><small>${al?'Combined ledger':E([cur.phone,(cur.days??30)+' days credit',cur.note].filter(Boolean).join(' · '))}</small></div><div style="flex:1"></div>
 <div class="chips">${[['all','All'],['pend','Pending audit'],['done','Audited'],['od','Overdue'],['soon','Due ≤7d']].map(([k,l])=>`<button class="chip ${flt==k?'on':''}" data-f="${k}">${l}</button>`).join('')}</div>
 ${al?'':`<button class="ib" data-x="editc" aria-label="Edit creditor">${ic('edit')}</button>`}<button class="btn txt" data-x="verify">Verify shown</button>`;
 const tw=$('#tw');
 if(!rows.length){tw.innerHTML=`<div class="em"><p>${all.length?'No entries match this filter.':db.c.length?'No entries yet. Use the entry bar below.':'Welcome! Type a creditor name in the entry bar below and add the first bill.'}</p></div>`;return}
 tw.innerHTML=`<table><thead><tr><th>Date</th>${al?'<th>Creditor</th>':''}<th>Details</th><th class="r">Billed</th><th class="r">Paid</th>${al?'':'<th class="r">Balance</th>'}<th>Status</th><th>Audit</th><th></th></tr></thead><tbody>${rows.map(e=>{const k=K[e.id];
  const st=e.t!='b'?'<span style="color:var(--tx2)">Payment</span>':!k.open?'<span class="pl g">Settled</span>':(k.od?`<span class="pl r">Overdue ${diff(T,k.due)}d</span>`:`<span class="pl">Due ${fs(k.due)}</span>`)+(k.open<e.a?`<small>${fm(k.open)} open</small>`:'');
  return`<tr data-id="${e.id}" class="${ed==e.id?'sel':''}"><td class="r" style="text-align:left">${fd(e.d)}</td>${al?`<td>${E(cname(e.c))}</td>`:''}<td class="dt">${E(e.ref)||'—'}${e.n?`<small>${E(e.n)}</small>`:''}</td><td class="r cr" data-l="Billed">${e.t=='b'?fm(e.a):''}</td><td class="r dr" data-l="Paid">${e.t=='p'?fm(e.a):''}</td>${al?'':`<td class="r" data-l="Bal.">${fm(bal[e.id])}</td>`}<td>${st}</td><td><button class="ck ${e.v?'v':''}" data-a="v" title="${e.v?'Audited on '+fd(e.v):'Mark as audited'}">${ic('ok',16)}</button></td><td class="r acts"><button class="ib" data-a="e" aria-label="Edit">${ic('edit',18)}</button><button class="ib" data-a="d" aria-label="Delete">${ic('del',18)}</button></td></tr>`}).join('')}</tbody><tfoot><tr><td colspan="${al?3:2}">Total (${rows.length} shown)</td><td class="r cr">${fm(sr.bill)}</td><td class="r dr">${fm(sr.paid)}</td><td colspan="${al?3:4}" class="r">Net ${fm(sr.out)}</td></tr></tfoot></table>`;
}

/* entry bar */
const bad=(id,m)=>{const i=$('#'+id),f=i.parentNode;f.classList.add('bad');setTimeout(()=>f.classList.remove('bad'),1400);i.focus();toast(m)};
function pick(id){sel=id;$('#dc').value=id=='all'?'':cname(id);$('aside').classList.remove('on');$('#scr').classList.remove('on')}
function resetDock(){ed=null;$('#dk').classList.remove('ed');$('#ds').textContent='Add entry';$('#dx').hidden=$('#dl').hidden=true;['da','dr','dn'].forEach(i=>$('#'+i).value='')}
function editE(e){ed=e.id;$('#dk').classList.add('ed');$('#ds').textContent='Update entry';$('#dx').hidden=$('#dl').hidden=false;
 $('#dc').value=cname(e.c);$('#dd').value=e.d;$('#da').value=e.a;$('#dr').value=e.ref||'';$('#dn').value=e.n||'';$(e.t=='b'?'#rb':'#rp').checked=true;render();$('#dk').classList.add('open');$('#da').focus()}
const delE=id=>{const u=snap();db.e=db.e.filter(x=>x.id!=id);if(ed==id)resetDock();save();render();toast('Entry deleted',u)};
$('#dk').onsubmit=ev=>{ev.preventDefault();
 const name=$('#dc').value.trim(),a=parseFloat($('#da').value.replace(/[,₹\s]/g,'')),d=$('#dd').value,t=$('#rp').checked?'p':'b';
 if(!name)return bad('dc','Enter the creditor name');if(!(a>0))return bad('da','Enter an amount greater than zero');if(!d)return bad('dd','Pick a date');
 let c=db.c.find(x=>x.name.toLowerCase()==name.toLowerCase()),made=0;
 const ref=$('#dr').value.trim();
 if(c&&t=='b'&&ref&&db.e.some(x=>x.id!=ed&&x.c==c.id&&x.t=='b'&&x.ref.toLowerCase()==ref.toLowerCase())&&!confirm('Bill no. '+ref+' already exists for '+c.name+'. Add anyway?'))return bad('dr','Possible duplicate bill');
 if(!c){c={id:uid(),name,phone:'',note:'',days:30};db.c.push(c);made=1}
 const o={c:c.id,d,t,a,ref,n:$('#dn').value.trim()};
 if(ed){const e=db.e.find(x=>x.id==ed);if(e.c!=o.c||e.a!=a||e.t!=t)e.v=0;Object.assign(e,o)}else db.e.push({id:uid(),...o,v:0});
 const was=ed;if(sel!='all'||made)sel=c.id;resetDock();$('#dc').value=c.name;save();bar();render();
 toast((was?'Entry updated':made?'New creditor added · entry saved':'Entry saved')+' · '+fm(a));
 if(innerWidth>900)$('#da').focus();else $('#dk').classList.remove('open');if(!was)setTimeout(()=>{const w=$('#tw');w.scrollTop=w.scrollHeight},30)};
$('#dx').onclick=()=>{resetDock();render();$('#dk').classList.remove('open')};$('#fab').onclick=()=>{$('#dk').classList.add('open');$('#dc').value||pick(sel);setTimeout(()=>$('#da').focus(),260)};$('#dcl').onclick=()=>$('#dk').classList.remove('open');$('#dl').onclick=()=>delE(ed);

/* creditor dialog */
const dg=$('#dg');dg.addEventListener('click',e=>{if(e.target==dg)dg.close()});
function formC(c){
 const F=[['name','Creditor name',c?.name],['phone','Phone',c?.phone],['days','Credit period (days)',c?.days??30,'number'],['note','GST / terms / note',c?.note]];
 dg.innerHTML=`<h2>${c?'Edit creditor':'New creditor'}</h2>${F.map(([k,l,v,t])=>`<div class="fld"><input id="f_${k}" type="${t||'text'}" placeholder=" " value="${E(v)}"><label>${l}</label></div>`).join('')}<div class="ac">${c?'<button class="btn txt red" id="f_d">Delete</button>':''}<span style="flex:1"></span><button class="btn txt" id="f_c">Cancel</button><button class="btn pri" id="f_s">Save</button></div>`;
 const go=()=>{const o={};F.forEach(([k])=>o[k]=$('#f_'+k).value.trim());
  if(!o.name)return toast('Enter the creditor name');if(db.c.some(x=>x.id!=c?.id&&x.name.toLowerCase()==o.name.toLowerCase()))return toast('This creditor already exists');
  o.days=Math.max(0,parseInt(o.days)||0);if(c)Object.assign(c,o);else{const n={id:uid(),...o};db.c.push(n);pick(n.id)}
  dg.close();save();bar();render();toast(c?'Creditor updated':'Creditor added');if(!c)$('#da').focus()};
 $('#f_c').onclick=()=>dg.close();$('#f_s').onclick=go;dg.onkeydown=e=>{if(e.key=='Enter')go()};
 if(c)$('#f_d').onclick=()=>{dg.close();const u=snap();db.c=db.c.filter(x=>x.id!=c.id);db.e=db.e.filter(e=>e.c!=c.id);pick('all');save();render();toast('Creditor and entries deleted',u)};
 dg.showModal();$('#f_name').focus()}

/* events */

 const t=ev.target,c=t.closest('[data-c]'),a=t.closest('[data-a]'),f=t.closest('[data-f]'),x=t.closest('[data-x]');

});

 dlf('creditor-audit-'+today()+'.csv',new Blob(['Date,Creditor,Bill/Voucher,Note,Billed,Paid,Audit\n'+db.e.filter(e=>sel=='all'||e.c==sel).sort(byD).map(e=>[e.d,cname(e.c),e.ref,e.n,e.t=='b'?e.a:'',e.t=='p'?e.a:'',e.v?'Audited '+e.v:'Pending'].map(q2).join(',')).join('\n')],{type:'text/csv'}));toast('CSV exported')};

/* Excel file import / export */
const XL=()=>typeof XLSX!='undefined';
const noX=()=>toast('Excel library did not load. Check your internet connection.');
function toWB(){K=calc();
 const a=db.c.map(c=>({ID:c.id,Creditor:c.name,Phone:c.phone||'','Credit days':c.days??30,Note:c.note||''}));
 const b=[...db.e].sort(byD).map(e=>({ID:e.id,Date:e.d,Creditor:cname(e.c),Type:e.t=='b'?'Bill':'Payment',Amount:e.a,'Bill/Voucher no.':e.ref||'',Note:e.n||'','Audited on':e.v||''}));
 const c=db.c.map(x=>{const es=db.e.filter(e=>e.c==x.id),s=stat(es);return{Creditor:x.name,Billed:s.bill,Paid:s.paid,Outstanding:s.out,Overdue:odv(es),Entries:s.n,Audited:s.v}});
 const wb=XLSX.utils.book_new();[['Creditors',a],['Entries',b],['Summary',c]].forEach(([n,r])=>XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(r),n));return wb}
function fromWB(wb){
 if(!wb.Sheets.Creditors&&!wb.Sheets.Entries)throw 0;
 const rd=n=>wb.Sheets[n]?XLSX.utils.sheet_to_json(wb.Sheets[n],{raw:true,defval:''}):[];
 const ds=v=>{if(typeof v=='number')return new Date(Math.round((v-25569)*864e5)).toISOString().slice(0,10);v=String(v).trim();const m=v.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})$/);if(m)return`${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;return/^\d{4}-\d{2}-\d{2}/.test(v)?v.slice(0,10):''};
 const c=[],e=[],by={};let skip=0;
 const add=(name,o={})=>{name=String(name).trim();if(!name)return null;const k=name.toLowerCase();if(!by[k]){const dy=parseInt(o.days);by[k]={id:o.id||uid(),name,phone:String(o.phone||''),note:String(o.note||''),days:isNaN(dy)?30:dy};c.push(by[k])}return by[k]};
 rd('Creditors').forEach(r=>add(r.Creditor,{id:String(r.ID||''),phone:r.Phone,note:r.Note,days:r['Credit days']}));
 rd('Entries').forEach(r=>{const cr=add(r.Creditor),a=parseFloat(r.Amount),d=ds(r.Date);if(!cr||!(a>0)||!d){skip++;return}
  const au=r['Audited on'];e.push({id:String(r.ID||'')||uid(),c:cr.id,d,t:/^p/i.test(String(r.Type))?'p':'b',a,ref:String(r['Bill/Voucher no.']),n:String(r.Note),v:ds(au)||0})});
 return{c,e,skip}}
function apply(d,msg,quiet){const u=snap();db={c:d.c,e:d.e};if(sel!='all'&&!db.c.some(c=>c.id==sel))sel='all';$('#dc').value=sel=='all'?'':cname(sel);ls.set('mann-cab',JSON.stringify(db));bar();render();toast(msg+(d.skip?` (${d.skip} rows skipped)`:''),quiet?null:u)}
$('#m4').onclick=()=>XL()?(XLSX.writeFile(toWB(),'creditor-audit-book-'+today()+'.xlsx'),toast('Excel file exported')):noX();
$('#m3').onclick=()=>$('#fi').click();
$('#fi').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;if(!XL())return noX();
 try{const d=fromWB(XLSX.read(await f.arrayBuffer(),{type:'array'}));apply(d,'Imported '+d.e.length+' entries');save()}catch(x){toast('That file is not a Creditor Audit Book workbook')}};

/* Google Sheets storage (via a free Google Apps Script web app) */
let GU=ls.get('cab-gs')??'https://script.google.com/macros/s/AKfycbzP2AqsAXAo1dIRvpiUAmvkr0kzh1mKaBnp0y-km8ijfW-SWI81iXeezAAS_hr7vUtioQ/exec',dirty=ls.get('cab-dirty')=='1';
const setSt=(k,t)=>{const x=$('#xs');x.className='xs '+k;x.innerHTML='<i></i>'+E(t)};
const hm=()=>new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
const GS=`function sh(n){var b=SpreadsheetApp.getActive();return b.getSheetByName(n)||b.insertSheet(n)}
function out(o){return ContentService.createTextOutput(JSON.stringify(o)).setMimeType(ContentService.MimeType.JSON)}
function put(n,h,r,t){var s=sh(n);s.clear();t.forEach(function(c){s.getRange(1,c,r.length+1,1).setNumberFormat('@')});s.getRange(1,1,r.length+1,h.length).setValues([h].concat(r));s.setFrozenRows(1)}
function doGet(){var c=sh('Creditors').getDataRange().getValues().slice(1),e=sh('Entries').getDataRange().getValues().slice(1);
return out({c:c.filter(function(r){return r[0]}).map(function(r){return{id:String(r[0]),name:String(r[1]),phone:String(r[2]),days:Number(r[3]),note:String(r[4])}}),
e:e.filter(function(r){return r[0]}).map(function(r){return{id:String(r[0]),c:String(r[1]),d:String(r[2]),t:r[3]=='Bill'?'b':'p',a:Number(r[4]),ref:String(r[5]),n:String(r[6]),v:r[7]?String(r[7]):0}})})}
function doPost(q){var d=JSON.parse(q.postData.contents),n={};d.c.forEach(function(c){n[c.id]=c.name});
put('Creditors',['ID','Creditor','Phone','Credit days','Note'],d.c.map(function(c){return[c.id,c.name,c.phone,c.days,c.note]}),[1,3]);
put('Entries',['ID','CreditorID','Date','Type','Amount','Bill/Voucher no.','Note','Audited on','Creditor name'],d.e.map(function(e){return[e.id,e.c,e.d,e.t=='b'?'Bill':'Payment',e.a,e.ref,e.n,e.v||'',n[e.c]||'']}),[1,2,3,6,8]);
return out({ok:true})}`;
async function push(){if(!GU)return;setSt('w','Saving to Google Sheet…');
 try{const r=await fetch(GU,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(db)}),j=await r.json();if(!j.ok)throw 0;
  dirty=false;ls.set('cab-dirty','0');setSt('ok','Google Sheet · saved '+hm())}
 catch(e){dirty=true;ls.set('cab-dirty','1');setSt('e','Sheet unreachable · click to retry')}}
const qsave=()=>{if(!GU)return;dirty=true;ls.set('cab-dirty','1');setSt('w','Saving…');clearTimeout(sv);sv=setTimeout(push,900)};
async function pull(quiet){if(!GU)return;setSt('w','Loading from Google Sheet…');
 try{const j=await(await fetch(GU)).json();if(!Array.isArray(j.c)||!Array.isArray(j.e))throw 0;
  if(!j.c.length&&!j.e.length&&(db.c.length||db.e.length)){await push();return toast('Sheet was empty, so your local data was uploaded')}
  apply({c:j.c,e:j.e},'Loaded from Google Sheet',quiet);dirty=false;ls.set('cab-dirty','0');setSt('ok','Google Sheet · synced '+hm())}
 catch(e){setSt('e','Sheet unreachable · click to retry')}}
function gsDlg(){
 dg.innerHTML=`<h2>Google Sheet storage</h2><ol><li>Create a Google Sheet (sheets.new).</li><li>Open <b>Extensions → Apps Script</b>, delete the existing code, paste the code below, then Save.</li><li><b>Deploy → New deployment → Web app</b>. Execute as <b>Me</b>, access <b>Anyone</b>. Authorize, then copy the Web app URL.</li><li>Paste the URL here. Your data lives in that Sheet and stays in sync from every device.</li></ol><textarea id="g_s" readonly>${E(GS)}</textarea><button class="btn txt" id="g_c">Copy script</button><div class="fld" style="margin-top:8px"><input id="g_u" placeholder=" " value="${E(GU)}"><label>Web app URL (https://script.google.com/macros/s/…/exec)</label></div><p style="color:var(--tx2);font-size:12px">Anyone with this URL can read and write the sheet data, so keep it private.</p><div class="ac">${GU?'<button class="btn txt red" id="g_d">Disconnect</button>':''}<span style="flex:1"></span><button class="btn txt" id="g_x">Cancel</button><button class="btn pri" id="g_s">Save &amp; connect</button></div>`;
 dg.onkeydown=null;$('#g_x').onclick=()=>dg.close();
 $('#g_c').onclick=()=>{$('#g_s').select();try{navigator.clipboard.writeText(GS)}catch(e){document.execCommand('copy')}toast('Script copied')};
 if(GU)$('#g_d').onclick=()=>{GU='';ls.set('cab-gs','');dg.close();setSt('n','Connect Google Sheet');toast('Disconnected. Data stays on this device.')};
 $('#g_s').onclick=async()=>{const u=$('#g_u').value.trim();if(!/^https:\/\/script\.google\.com\/.+\/exec/.test(u))return toast('Paste the Web app URL ending in /exec');
  GU=u;ls.set('cab-gs',u);dg.close();
  try{const j=await(await fetch(u)).json();if(!Array.isArray(j.c))throw 0;
   if(j.c.length||j.e.length){if(db.c.length&&!confirm('This Sheet already has data. OK = load it (replaces data on this device). Cancel = overwrite the Sheet with this device\'s data.')){await push();return}await pull(false)}
   else await push()}catch(e){setSt('e','Sheet unreachable · check URL & access');toast('Could not reach the web app. Check it is deployed for Anyone.')}}
 ;dg.showModal()}
$('#xs').onclick=()=>GU?(dirty?push():pull(false)):gsDlg();$('#m0').onclick=gsDlg;$('#m6').onclick=()=>GU?pull(false):gsDlg();
window.addEventListener('online',()=>{if(GU&&dirty)push()});

if(ls.get('mann-theme'))document.documentElement.dataset.theme=ls.get('mann-theme');
$('#si').innerHTML=ic('search');$('#bm').innerHTML=ic('menu');$('#mo').innerHTML=ic('more');$('#ac').innerHTML=ic('plus',20)+'New creditor';

if(GU){setSt('w','Connecting…');dirty?push():pull(true)}
</script>
